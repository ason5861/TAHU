name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.demo
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: docker build -t tahu-probe:ci sandbox
      - name: Verify actual container boundaries and gateway integration
        shell: bash
        run: |
          export TAHU_TEST_IMAGE=$(docker image inspect tahu-probe:ci --format '{{.Id}}')
          python -m unittest tests.test_isolation.DockerIntegrationTests -v
          python -m examples.isolated_demo --image "$TAHU_TEST_IMAGE"
